name: Deploy to VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 40m
          command_timeout: 30m
          script: |
            cd ~/slip-digital
            
            git checkout .
            git pull origin main
            
            echo "Memulai proses build. Mohon tunggu, ini prosesnya di belakang layar..."
            
            # Kita buang output ribuan baris dari docker ke dalam file agar SSH Github-nya tidak error
            docker compose up -d --build app > build-deploy.log 2>&1
            
            echo "Deploy Berhasil! Cek website kamu sekarang."
